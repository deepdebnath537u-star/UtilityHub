    <style>
        * {
            box-sizing: border-box;

        body {

            border: none;

            background: #00a8ff;

<body>

<div class="container">

    <h1>📑 Merge PDF</h1>

    <p class="description">
        Combine multiple PDF files into one PDF quickly and easily.
    </p>

    <input
        class="file-input"
        type="file"
        id="mergePdfFiles"
        accept="application/pdf"
        multiple
    >

    <div class="file-list" id="fileList"></div>

    <button class="merge" onclick="mergePDFs()">
        📑 Merge PDFs
    </button>

    <a class="back" href="index.html">
        ← Back to UtilityHub
    </a>

    <div class="info">

        <h2>Merge PDF Online</h2>

        <p>
            Select two or more PDF files and combine them into a single PDF
            directly in your browser.
        </p>

    </div>

</div>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<script>

const fileInput = document.getElementById("mergePdfFiles");
const fileList = document.getElementById("fileList");

fileInput.addEventListener("change", function () {

    fileList.innerHTML = "";

    Array.from(this.files).forEach((file, index) => {

        const item = document.createElement("div");

        item.className = "file-item";

        item.textContent =
            (index + 1) + ". " + file.name;

        fileList.appendChild(item);
    });
});


async function mergePDFs() {

    const files = fileInput.files;

    if (files.length < 2) {

        alert("Please select at least 2 PDF files.");

        return;
    }

    try {

        const { PDFDocument } = PDFLib;

        const mergedPdf =
            await PDFDocument.create();

        for (const file of files) {

            const arrayBuffer =
                await file.arrayBuffer();

            const pdf =
                await PDFDocument.load(arrayBuffer);

            const pages =
                await mergedPdf.copyPages(
                    pdf,
                    pdf.getPageIndices()
                );

            pages.forEach(page => {

                mergedPdf.addPage(page);

            });
        }

        const mergedBytes =
            await mergedPdf.save();

        const blob =
            new Blob(
                [mergedBytes],
                { type: "application/pdf" }
            );

        const url =
            URL.createObjectURL(blob);

        const link =
            document.createElement("a");

        link.href = url;

        link.download =
            "UtilityHub-Merged.pdf";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        URL.revokeObjectURL(url);

    } catch (error) {

        console.error(error);

        alert(
            "Could not merge the PDFs. Please make sure the files are valid PDF documents."
        );
    }
}

</script>

</body>
