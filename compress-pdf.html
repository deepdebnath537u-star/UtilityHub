<body>

<div class="container">

    <h1>🗜️ Compress PDF</h1>

    <p class="description">
        Reduce the size of your PDF file quickly and easily.
    </p>

    <input
        type="file"
        id="compressPdfFile"
        accept="application/pdf"
    >

    <div class="info" id="pdfInfo"></div>

    <div class="options">

        <label for="compressionQuality">
            Compression Level
        </label>

        <select id="compressionQuality">

            <option value="0.8">
                High Quality — Larger File
            </option>

            <option value="0.6" selected>
                Medium — Recommended
            </option>

            <option value="0.4">
                Strong Compression — Smaller File
            </option>

        </select>

    </div>

    <button class="compress" onclick="compressPDF()">
        🗜️ Compress PDF
    </button>

    <a class="back" href="index.html">
        ← Back to UtilityHub
    </a>

    <div class="info-section">

        <h2>Compress PDF Online</h2>

        <p>
            Select a PDF file and choose a compression level.
            The compressed PDF will be downloaded to your device.
        </p>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

const fileInput =
    document.getElementById("compressPdfFile");

const pdfInfo =
    document.getElementById("pdfInfo");


fileInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) {

        pdfInfo.innerHTML = "";

        return;
    }

    const sizeMB =
        (file.size / (1024 * 1024)).toFixed(2);

    pdfInfo.innerHTML =
        "<b>Selected:</b> " + file.name +
        "<br>" +
        "<b>Original size:</b> " + sizeMB + " MB";
});


async function compressPDF() {

    const file =
        fileInput.files[0];

    if (!file) {

        alert("Please select a PDF file.");

        return;
    }

    try {

        alert("Compressing PDF... Please wait.");

        const quality =
            Number(
                document.getElementById(
                    "compressionQuality"
                ).value
            );

        const arrayBuffer =
            await file.arrayBuffer();

        const pdf =
            await pdfjsLib.getDocument({
                data: arrayBuffer
            }).promise;

        const { jsPDF } =
            window.jspdf;

        let outputPdf = null;

        for (
            let pageNumber = 1;
            pageNumber <= pdf.numPages;
            pageNumber++
        ) {

            const page =
                await pdf.getPage(pageNumber);

            const viewport =
                page.getViewport({
                    scale: 1.3
                });

            const canvas =
                document.createElement("canvas");

            const context =
                canvas.getContext("2d");

            canvas.width =
                viewport.width;

            canvas.height =
                viewport.height;

            await page.render({
                canvasContext: context,
                viewport: viewport
            }).promise;

            const imageData =
                canvas.toDataURL(
                    "image/jpeg",
                    quality
                );

            const pageWidth = 210;
            const pageHeight = 297;

            const ratio =
                Math.min(
                    pageWidth / canvas.width,
                    pageHeight / canvas.height
                );

            const finalWidth =
                canvas.width * ratio;

            const finalHeight =
                canvas.height * ratio;

            const x =
                (pageWidth - finalWidth) / 2;

            const y =
                (pageHeight - finalHeight) / 2;


            if (pageNumber === 1) {

                outputPdf =
                    new jsPDF({
                        orientation:
                            finalHeight > finalWidth
                                ? "portrait"
                                : "landscape",

                        unit: "mm",

                        format: "a4",

                        compress: true
                    });

            } else {

                outputPdf.addPage(
                    "a4",
                    finalHeight > finalWidth
                        ? "portrait"
                        : "landscape"
                );
            }


            outputPdf.addImage(
                imageData,
                "JPEG",
                x,
                y,
                finalWidth,
                finalHeight,
                undefined,
                "FAST"
            );
        }


        const compressedBlob =
            outputPdf.output("blob");

        const originalSize =
            (
                file.size /
                (1024 * 1024)
            ).toFixed(2);

        const compressedSize =
            (
                compressedBlob.size /
                (1024 * 1024)
            ).toFixed(2);


        const downloadUrl =
            URL.createObjectURL(
                compressedBlob
            );

        const link =
            document.createElement("a");

        link.href =
            downloadUrl;

        link.download =
            "UtilityHub-Compressed.pdf";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        URL.revokeObjectURL(
            downloadUrl
        );


        alert(
            "Compression complete!\n\n" +
            "Original: " +
            originalSize +
            " MB\n" +
            "Compressed: " +
            compressedSize +
            " MB"
        );

    } catch (error) {

        console.error(error);

        alert(
            "Could not compress this PDF. Please try another PDF."
        );
    }
}

</script>
