<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image to PDF Converter - UtilityHub</title>
    <meta name="description" content="Convert multiple images to a PDF online for free with UtilityHub. Fast, simple and mobile-friendly image to PDF converter.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://deepdebnath537u-star.github.io/UtilityHub/image-to-pdf.html">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 15px;
            background:
                radial-gradient(circle at 20% 20%, rgba(0, 255, 255, 0.12), transparent 30%),
                radial-gradient(circle at 80% 30%, rgba(170, 0, 255, 0.14), transparent 30%),
                linear-gradient(135deg, #050510, #0b0b1f 50%, #050510);
            color: white;
        }

        .container {
            width: 100%;
            max-width: 430px;
            margin: 25px auto;
            padding: 22px 18px;
            text-align: center;

            background: rgba(20, 20, 45, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.22);
            border-radius: 20px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.35),
                inset 0 0 20px rgba(255, 255, 255, 0.025);
        }

        h1 {
            font-size: 25px;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .description {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .file-input {
            width: 100%;
            padding: 11px;
            border: 1px dashed #64748b;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 14px;
        }

        .preview {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 16px 0;
        }

        .preview img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 9px;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .generate {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #00a8ff;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .generate:active {
            transform: scale(0.98);
        }

        .back {
            display: inline-block;
            margin-top: 14px;
            padding: 9px 16px;
            border: 1px solid rgba(0, 255, 255, 0.22);
            border-radius: 10px;
            color: white;
            text-decoration: none;
            background: rgba(20, 20, 45, 0.7);
            font-size: 14px;
        }

        .info {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: left;
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.6;
        }

        .info h2 {
            color: white;
            font-size: 18px;
            margin-bottom: 7px;
        }

        .info p + p {
            margin-top: 8px;
        }

        @media (max-width: 600px) {
            body {
                padding: 8px;
            }

            .container {
                margin: 15px auto;
                padding: 20px 15px;
            }

            h1 {
                font-size: 23px;
            }

            .preview img {
                height: 75px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📄 Image to PDF</h1>

    <p class="description">
        Convert images into one PDF quickly and easily.
    </p>

    <input
        class="file-input"
        type="file"
        id="pdfImages"
        accept="image/*"
        multiple
    >

    <div class="preview" id="imagePreview"></div>

    <button class="generate" onclick="generatePDF()">
        📑 Generate PDF
    </button>

    <a class="back" href="index.html">
        ← Back to UtilityHub
    </a>

    <div class="info">
        <h2>Image to PDF Converter</h2>

        <p>
            Select one or multiple images and convert them into a single PDF
            directly in your browser.
        </p>
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const imageInput = document.getElementById("pdfImages");
const preview = document.getElementById("imagePreview");

imageInput.addEventListener("change", function () {

    preview.innerHTML = "";

    Array.from(this.files).forEach(file => {

        const reader = new FileReader();

        reader.onload = function(event) {

            const img = document.createElement("img");

            img.src = event.target.result;
            img.alt = "Selected image preview";

            preview.appendChild(img);
        };

        reader.readAsDataURL(file);
    });
});


async function generatePDF() {

    const files = imageInput.files;

    if (!files.length) {
        alert("Please select at least one image.");
        return;
    }

    try {

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF("p", "mm", "a4");

        for (let i = 0; i < files.length; i++) {

            const image = await loadImage(files[i]);

            if (i > 0) {
                pdf.addPage();
            }

            const pageWidth = 210;
            const pageHeight = 297;

            const ratio = Math.min(
                pageWidth / image.width,
                pageHeight / image.height
            );

            const width = image.width * ratio;
            const height = image.height * ratio;

            const x = (pageWidth - width) / 2;
            const y = (pageHeight - height) / 2;

            const format =
                files[i].type === "image/png"
                    ? "PNG"
                    : "JPEG";

            pdf.addImage(
                image,
                format,
                x,
                y,
                width,
                height
            );
        }

        pdf.save("UtilityHub-Images.pdf");

    } catch (error) {

        console.error(error);

        alert("Could not create the PDF. Please try again.");
    }
}


function loadImage(file) {

    return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = function(event) {

            const img = new Image();

            img.onload = function() {
                resolve(img);
            };

            img.onerror = reject;
            img.src = event.target.result;
        };

        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}
</script>

</body>
</html>
